name: Finish Sabaibu Hardening

on:
  push:
    branches:
      - fix/adversarial-hardening-ranking-score
    paths:
      - scripts/finish_sabaibu_hardening.py
      - .github/workflows/finish-sabaibu-hardening.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/adversarial-hardening-ranking-score
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply final patch
        run: python scripts/finish_sabaibu_hardening.py

      - name: Remove temporary patch runner
        run: rm scripts/finish_sabaibu_hardening.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Tests
        run: pnpm run test:rules

      - name: Build
        run: pnpm run build

      - name: Whitespace check
        run: git diff --check

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/game/GameWorld.ts client/src/hooks/useGameRanking.ts client/src/hooks/useGameRanking.test.ts supabase/migrations/20260823160000_sabaibu_verified_ranking.sql scripts/finish_sabaibu_hardening.py
          git commit -m "fix: close final collision and ranking validation gaps"
          git push origin HEAD:fix/adversarial-hardening-ranking-score
