name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Verify Pages artifact
        shell: bash
        run: |
          test -s dist/public/index.html
          if grep -Eq '(src|href)="/assets/' dist/public/index.html; then
            echo "Found a root-relative asset reference in the Pages HTML."
            exit 1
          fi
          if grep -Eq '%VITE_[A-Z0-9_]+%' dist/public/index.html; then
            echo "Found an unresolved Vite placeholder in the Pages HTML."
            exit 1
          fi
          grep -Eq '(src|href)="/sabaibu/assets/' dist/public/index.html
          for asset in \
            neon-siege-floor.svg \
            neon-siege-drone-panel.svg \
            neon-siege-sigil.svg \
            neon-siege-visual-target.svg; do
            test -s "dist/public/assets/$asset"
          done
          for audio in cc0-metal1.wav cc0-switch1.wav; do
            test -s "dist/public/audio/$audio"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
