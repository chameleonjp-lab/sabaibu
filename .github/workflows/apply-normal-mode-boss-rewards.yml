name: Apply Normal Mode Boss Rewards

on:
  push:
    branches:
      - fix/normal-mode-boss-rewards
    paths:
      - ".github/workflows/apply-normal-mode-boss-rewards.yml"

permissions:
  contents: write

concurrency:
  group: apply-normal-mode-boss-rewards
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/normal-mode-boss-rewards
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply requested changes
        run: python scripts/apply_normal_mode_boss_rewards.py

      - name: Remove temporary patch script
        run: rm scripts/apply_normal_mode_boss_rewards.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Rule and runtime tests
        run: pnpm run test:rules

      - name: Build
        run: pnpm run build

      - name: Verify whitespace
        run: git diff --check

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: revise normal upgrades and boss rewards"
          git push origin HEAD:fix/normal-mode-boss-rewards
