name: Apply sabaibu hardening

on:
  push:
    branches:
      - fix/adversarial-hardening-ranking-score
    paths:
      - "scripts/.sabaibu_patch.part*"
      - ".github/workflows/apply-sabaibu-hardening.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/.sabaibu_patch.part*"
      - ".github/workflows/apply-sabaibu-hardening.yml"

permissions:
  contents: write

concurrency:
  group: apply-sabaibu-hardening
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: fix/adversarial-hardening-ranking-score
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Decode and apply implementation patch
        shell: bash
        run: |
          cat scripts/.sabaibu_patch.part* | base64 --decode | xz --decompress > /tmp/apply_sabaibu_hardening.py
          python /tmp/apply_sabaibu_hardening.py
          python - <<'PY'
          from pathlib import Path
          path = Path("client/src/game/GameWorld.runtime.test.ts")
          text = path.read_text()
          old = "\n    for (let frame = 0; frame < 600; frame += 1) world.update(1 / 60);"
          new = "\n    world.setTouchDirection(0.4, 0.2);\n    for (let frame = 0; frame < 600; frame += 1) world.update(1 / 60);"
          if text.count(old) != 1:
              raise SystemExit(f"runtime smoke insertion target count: {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
          rm scripts/.sabaibu_patch.part*
          # GITHUB_TOKEN cannot update workflow files. Keep this temporary
          # workflow unchanged and restore the Pages workflow for this commit;
          # the connected GitHub app removes/updates them after verification.
          git restore .github/workflows/deploy-pages.yml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Rule and runtime tests
        run: pnpm run test:rules

      - name: Build
        run: pnpm run build

      - name: Verify whitespace
        run: git diff --check

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "chameleonjp-lab automation"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "feat: harden gameplay scoring controls and ranking"
          git push origin HEAD:fix/adversarial-hardening-ranking-score
